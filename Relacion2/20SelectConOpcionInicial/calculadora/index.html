<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 20 · Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body class="bg-secondary-subtle">
    <main class="container min-vh-100 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-6">
                <h1 class="h2 text-primary text-center mb-4">Calculadora</h1>

                <form class="border rounded bg-white p-4 shadow" action="calculos.php" method="post">
                    <label for="num1" class="form-label">Primer número</label>
                    <input class="form-control mb-3" type="number" step="any" id="num1" name="num1" required>

                    <label for="num2" class="form-label">Segundo número</label>
                    <input class="form-control mb-3" type="number" step="any" id="num2" name="num2" required>

                    <label for="operador" class="form-label">Operación</label>
                    <select class="form-select mb-4" id="operador" name="operador" required>
                        <option value="" selected disabled>Selecciona una operación</option>
                        <option value="+">Suma (+)</option>
                        <option value="-">Resta (−)</option>
                        <option value="*">Multiplicación (×)</option>
                        <option value="/">División (÷)</option>
                        <option value="%">Módulo (%)</option>
                    </select>

                    <button class="btn btn-success w-100" type="submit">Calcular</button>
                </form>

                <a class="btn btn-link mt-3" href="../index.html">Volver al conversor</a>
            </div>
        </div>
    </main>
</body>
</html>
