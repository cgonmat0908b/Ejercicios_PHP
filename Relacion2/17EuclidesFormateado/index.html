<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Enlace de la hoja de estilo de bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="./script.js" defer></script>
</head>

<body class="bg-secondary ">

    <!-- Guia grid para distribuir espacio-->
    <!-- 1º Div con class "container"-->

    <div id="main" class="container text-center bg-secondary-subtle min-vh-100">

        <h2 class="text-primary mt-3 pt-4">Formulario de referencia</h2>
        <!-- 2º Div con class "row" -->
        <div class="row">

            <!-- 3º Número de columnas en las que distribuimos la página
            en total, 12 columnas -->
            <div class="col-md-3 col-sm-1 col-0">
                <!-- Espacio en blanco a la izuierda -->
            </div>

            <div class="col-md-6 col-sm-10 col-12">

                <form class="m-auto mt-5 border rounded p-4 shadow-lg" action="calculos.php" method="post">

                    <div class="mb-3 form-check">

                        <label for="num1" class="form-label ">Dividendo:</label>
                        <input type="number" step="any" class="form-control" id="num1" name="num1">
                    
                    </div>

                    <div class="mb-3 form-check">

                        <label for="nota1" class="form-label ">Divisor:</label>
                        <input type="number" step="any" class="form-control" id="num2" name="num2">
                    
                    </div><br>

                    <div class="d-flex flex-column align-items-center gap-2 mb-3">

                        <div class="d-flex align-items-center gap-2">
                            <input class="form-check-input m-0" type="checkbox"
                                id="cociente" name="cociente">
                            <label for="cociente">Calcular cociente</label>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <input class="form-check-input m-0" type="checkbox"
                                id="resto" name="resto">
                            <label for="resto">Calcular resto</label>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success form-check">Submit</button>
                    
                </form>

            </div>

            <div class="col-md-3 col-sm-1 col-0">
                <!-- Espacio en blanco a la derecha -->
            </div>

        </div>

    </div>
    
</body>

</html>
