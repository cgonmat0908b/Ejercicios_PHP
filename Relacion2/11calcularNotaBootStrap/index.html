<body class="bg-secondary ">

    <!-- Guia grid para distribuir espacio-->
    <!-- 1º Div con class "container"-->

    <div id="main" class="container text-center bg-secondary-subtle min-vh-100">

        <h2 class="text-primary mt-3 pt-4">Formulario de referencia</h2>
        <!-- 2º Div con class "row" -->
        <div class="row">

            <!-- 3º Número de columnas en las que distribuimos la página
            en total, 12 columnas -->
            <div class="col-md-3 col-sm-1 col-0">
                <!-- Espacio en blanco a la izuierda -->
            </div>

            <div class="col-md-6 col-sm-10 col-12">

                <form class="m-auto mt-5 border rounded p-4 shadow-lg" action="calcularNota.php" method="post">

                    <div class="mb-3">

                        <label for="num1" class="form-label">Primera nota: </label>
                        <input type="number" min="1" max="10" required class="form-control" id="num1" aria-describedby="emailHelp" name="num1">

                        <div id="ayudaNum1" class="form-text">Valores del 1 al 10</div>
                    
                    </div>

                    <div class="mb-3">

                        <label for="num2" class="form-label">Segunda nota: </label>
                        <input type="number" min="1" max="10" required class="form-control" id="num2" name="num2">

                        <div id="ayudaNum2" class="form-text">Valores del 1 al 10</div>
                    
                    </div>

                    
                    <div class="mb-3">

                        <label for="numFaltas" class="form-label">Número de faltas:</label>
                        <input type="number" min="1" max="36" required class="form-control" id="numFaltas" name="numFaltas">

                        <div id="numFaltas" class="form-text">Valores del 0 al 36</div>
                    
                    </div>
                    
                    <button type="submit" class="btn btn-success">Submit</button>
                    
                </form>

            </div>

            <div class="col-md-3 col-sm-1 col-0">
                <!-- Espacio en blanco a la derecha -->
            </div>

        </div>

    </div>
